name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clash_soccer
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-password
      ADMIN_AUTH_SECRET: ci-secret-ci-secret-ci-secret-1234
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clash_soccer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clash_soccer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clash_soccer_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clash_soccer_test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-password
      ADMIN_AUTH_SECRET: ci-secret-ci-secret-ci-secret-1234
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run smoke:db

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clash_soccer_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clash_soccer_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clash_soccer_e2e
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: e2e-password-123
      ADMIN_AUTH_SECRET: e2e-secret-e2e-secret-e2e-secret-1234
      SITE_URL: http://127.0.0.1:3000
      UPLOAD_DIR: .data/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
