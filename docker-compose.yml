services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clash_soccer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clash_soccer"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - clash_soccer_data:/var/lib/postgresql/data

volumes:
  clash_soccer_data:
